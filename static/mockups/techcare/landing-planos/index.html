<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing · planos do TechCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:225 14% 92%;--ink-ui:240 10% 6%;--border-ui:240 5.9% 90%;--muted-ui:240 3.8% 46%;
  --success-soft:142 55% 94%;--success-ink:142 70% 24%;
}
*{box-sizing:border-box}
body{margin:0;background:hsl(var(--canvas));color:hsl(var(--ink-ui));font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}

/* Documento */
.doc{max-width:1560px;margin:0 auto;padding:28px 24px 64px}
.doc-hd h1{font:600 22px Sora,Inter,sans-serif;letter-spacing:-.015em}
.doc-hd p{margin-top:6px;color:hsl(var(--muted-ui));max-width:900px}
.bar{display:flex;gap:10px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.bar small{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(var(--muted-ui));min-width:64px}
.seg{display:inline-flex;background:#fff;border:1px solid hsl(var(--border-ui));border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:500;color:hsl(var(--muted-ui))}
.seg button[aria-pressed=true]{background:hsl(var(--ink-ui));color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start;margin-top:14px}
.notes{background:#fff;border:1px solid hsl(var(--border-ui));border-radius:14px;padding:18px;position:sticky;top:16px}
.notes h3{font:600 15px Sora,Inter,sans-serif}
.notes .tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:hsl(240 4.8% 95.9%);color:hsl(var(--muted-ui))}
.notes .tag.rec{background:hsl(var(--success-soft));color:hsl(var(--success-ink))}
.notes dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:hsl(var(--muted-ui));margin-top:12px}
.notes dl{margin:4px 0 0}
.notes dd{margin:3px 0 0;color:hsl(240 6% 22%)}
.notes hr{border:0;border-top:1px solid hsl(var(--border-ui));margin:16px 0}
.notes ul{margin:8px 0 0;padding-left:18px;color:hsl(240 6% 22%)}
.notes li{margin:5px 0}
.browser{background:#fff;border:1px solid hsl(var(--border-ui));border-radius:14px;overflow:hidden}
.chrome{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;border-bottom:1px solid hsl(var(--border-ui));background:hsl(0 0% 98%)}
.chrome i{width:10px;height:10px;border-radius:50%;background:hsl(var(--border-ui))}
.chrome .url{flex:1;max-width:420px;margin:0 auto;height:24px;border-radius:7px;background:hsl(240 4.8% 95.9%);font-size:12px;color:hsl(var(--muted-ui));display:flex;align-items:center;padding:0 10px}
.viewport{position:relative;overflow:hidden}
.screen{position:absolute;top:0;left:0;transform-origin:0 0;width:1280px}
.phone-wrap{display:flex;justify-content:center;padding:28px 0;background:hsl(var(--canvas));border:0}
.phone{width:390px;height:844px;border-radius:44px;border:10px solid hsl(var(--ink-ui));overflow:auto;background:#fff;scrollbar-width:none}
.phone::-webkit-scrollbar{display:none}

/* Landing (mesmos tokens da techcare.css) */
.tc{--disp:Sora,system-ui,sans-serif;--ink:#16201a;--muted:#44524a;--soft:#6a766e;--brand:#16a34a;--brand-ink:#0f7a36;--brand-soft:#effaf2;--cream:#f4f6f1;--line:rgba(16,32,24,.12);background:#fff;color:var(--ink);line-height:1.5}
.tc-nav{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 40px;border-bottom:1px solid var(--line)}
.tc-logo{display:flex;align-items:center;gap:10px;font:700 16px var(--disp)}
.tc-logo i{width:24px;height:24px;border-radius:6px;background:var(--brand)}
.tc-logo span{color:var(--soft);font-weight:500}
.tc-links{display:flex;gap:28px;color:var(--muted);font-size:14px}
.tc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap;border:1px solid transparent}
.tc-btn.pri{background:var(--brand);color:#fff}
.tc-btn.out{border-color:var(--line);color:var(--ink);background:#fff}
.tc-btn svg{width:16px;height:16px;flex:none}

.sec{padding:88px 40px 96px}
.pitch{max-width:640px;margin:0 auto;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:10px;font:600 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-ink)}
.kicker::before{content:"";width:24px;height:2px;background:var(--brand)}
.pitch h2{margin-top:14px;font:800 44px/1.08 var(--disp);letter-spacing:-.025em}
.pitch p{margin-top:14px;color:var(--muted);font-size:16px}

.billing{display:flex;justify-content:center;margin-top:28px}
.billing .seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;background:#fff}
.billing button{appearance:none;border:0;background:none;border-radius:999px;height:36px;padding:0 16px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.billing button[aria-pressed=true]{background:var(--ink);color:#fff}
.billing em{font-style:normal;font-size:12px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);border-radius:99px;padding:2px 8px}
.billing button[aria-pressed=true] em{background:rgba(255,255,255,.16);color:#fff}

/* A · cards */
.grid{display:grid;gap:16px;max-width:1040px;margin:40px auto 0}
.grid.n3{grid-template-columns:repeat(3,1fr)}
.grid.n4{grid-template-columns:repeat(4,1fr);max-width:1180px}
.grid.n2{grid-template-columns:repeat(2,1fr);max-width:700px}
.plan{position:relative;border:1px solid var(--line);border-radius:16px;padding:28px 24px 24px;display:flex;flex-direction:column;background:#fff}
.plan.rec{border:1.5px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),#fff 140px)}
.selo{position:absolute;top:-12px;left:24px;height:24px;padding:0 10px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.plan h3{font:700 20px var(--disp);letter-spacing:-.01em}
.plan .desc{margin-top:6px;color:var(--muted);font-size:14px;min-height:42px}
.price{display:flex;align-items:baseline;gap:4px;margin-top:20px}
.price small{font-size:15px;color:var(--muted)}
.price b{font:800 42px/1 var(--disp);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:14px}
.under{margin-top:8px;color:var(--soft);font-size:13px;min-height:20px}
.under strong{color:var(--brand-ink);font-weight:600}
.plan .tc-btn{margin-top:20px;width:100%}
.feats{list-style:none;padding:0;margin:22px 0 0;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:12px}
.feats li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.feats li i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.feats li.on i{background:var(--brand-soft);color:var(--brand-ink)}
.feats li.off{color:var(--soft)}
.feats li.off i{color:var(--soft)}
.feats li.off i::before{content:"";width:8px;height:1.5px;background:currentColor;border-radius:2px}
.feats li i svg{width:12px;height:12px}
.feats .group{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:4px}
.assure{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin-top:28px;color:var(--muted);font-size:14px}
.assure span{display:inline-flex;align-items:center;gap:7px}
.assure span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}

/* B · tabela */
.table{max-width:1080px;margin:40px auto 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trow{display:grid;grid-template-columns:240px repeat(var(--n),minmax(0,1fr))}
.trow > div{padding:16px 20px;border-top:1px solid var(--line)}
.trow.head > div{border-top:0;padding:24px 20px}
.trow > div.rec{background:var(--brand-soft)}
.trow.head .rec{box-shadow:inset 0 3px 0 var(--brand)}
.th h3{font:700 18px var(--disp)}
.th .desc{color:var(--muted);font-size:13px;margin-top:4px;min-height:40px}
.th .price{margin-top:12px}
.th .price b{font-size:34px}
.th .under{min-height:20px}
.th .tc-btn{width:100%;margin-top:14px}
.trow.head > div.th{position:relative;padding-top:44px}
.th .selo{position:absolute;top:14px;left:20px}
.th .tc-btn{white-space:normal;height:auto;min-height:42px;padding:8px 10px;font-size:13px;line-height:1.25}
.th .under{font-size:12.5px}
.tlabel{font-size:14px;font-weight:500}
.tlabel small{display:block;color:var(--soft);font-weight:400;font-size:12.5px}
.tgroup > div{padding:12px 20px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);background:var(--cream)}
.tgroup > div.rec{background:#e3f4e8}
.cell{display:flex;align-items:center;justify-content:center}
.cell i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.cell.on i{background:var(--brand);color:#fff}
.cell.on i svg{width:13px;height:13px}
.cell.off i::before{content:"";width:10px;height:1.5px;border-radius:2px;background:var(--soft)}

/* Hub fora */
.fallback{max-width:620px;margin:40px auto 0;border:1px solid var(--line);border-radius:16px;padding:40px;text-align:center;background:var(--cream)}
.fallback h3{font:700 22px var(--disp)}
.fallback p{margin-top:8px;color:var(--muted)}
.fallback .tc-btn{margin-top:22px}

/* Celular */
.m .tc-nav{height:60px;padding:0 20px}
.m .tc-links{display:none}
.m .tc-nav .tc-btn{height:36px;padding:0 12px;font-size:13px}
.m .sec{padding:48px 20px 56px}
.m .pitch h2{font-size:30px}
.m .pitch p{font-size:15px}
.m .grid{grid-template-columns:1fr!important;margin-top:28px;gap:24px}
.m .plan .desc{min-height:0}
.m .table{display:none}
.m .fallback{padding:28px 20px}
.mpick{display:none}
.m .mpick{display:block;margin-top:24px}
.mpick .tabs{display:flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.mpick .tabs button{flex:1;appearance:none;border:0;background:none;border-radius:9px;height:40px;font-weight:600;font-size:13px;color:var(--muted)}
.mpick .tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.mpick .plan{margin-top:16px}
</style>
</head>
<body>
<div class="doc">
  <div class="doc-hd">
    <h1>Landing · planos do TechCare</h1>
    <p>A seção de planos de facter.com.br/techcare. Os planos, preços e recursos continuam vindo do Hub; o mockup muda como eles aparecem. Duas opções para escolher uma. Troque o estado para ver os planos e o Hub sem responder.</p>
  </div>

  <div class="bar"><small>Opção</small>
    <div class="seg" id="opts">
      <button data-v="a">A · Cards lado a lado</button>
      <button data-v="b">B · Tabela para comparar</button>
    </div>
  </div>
  <div class="bar"><small>Estado</small>
    <div class="seg" id="states">
      <button data-v="three">3 planos</button>
      <button data-v="down">Hub sem responder</button>
    </div>
    <div class="seg" id="devs">
      <button data-v="desktop">Notebook</button>
      <button data-v="phone">Celular</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="browser" id="desk">
        <div class="chrome"><i></i><i></i><i></i><div class="url">facter.com.br/techcare#planos</div></div>
        <div class="viewport" id="vp"><div class="screen tc" id="screen"></div></div>
      </div>
      <div class="browser phone-wrap" id="mob" hidden>
        <div class="phone tc m" id="phone"></div>
      </div>
    </div>
    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.3z"/></svg>';

/* Recursos como o Hub devolve (nome + categoria); a ordem aqui é a do Hub. */
const FEATURES = [
  {name: 'Estoque de peças', hint: 'Aviso quando está acabando', cat: 'Estoque'},
  {name: 'Fornecedores e reposição', hint: 'Pedido de compra pelo WhatsApp', cat: 'Estoque'},
  {name: 'Orçamento com link pro cliente', hint: 'O cliente aprova pelo celular', cat: 'Vendas'},
  {name: 'Ordens de serviço', hint: 'Do balcão até a entrega', cat: 'Operação'},
  {name: 'Garantia e retorno', hint: 'Cada garantia com código', cat: 'Operação'},
];

const PLANS = {
  three: [
    {name: 'Estoque', desc: 'Para controlar as peças e repor antes de faltar.', m: 79, y: 790, on: [0, 1]},
    {name: 'Estoque Pro', desc: 'O estoque e o orçamento que o cliente aprova pelo link.', m: 119, y: 1190, on: [0, 1, 2], rec: true},
    {name: 'Essencial', desc: 'A assistência inteira: OS, estoque, orçamento e garantia.', m: 149, y: 1490, on: [0, 1, 2, 3, 4]},
  ],
};

const OPTIONS = {
  a: {title: 'A · Cards lado a lado', tag: 'Recomendada', rec: true,
    what: 'Um card por plano, todos com a mesma lista de recursos na mesma ordem. O que o plano tem vem com o check verde; o que não tem fica cinza com um traço. Assim a comparação é uma olhada na horizontal e nenhum card fica com a lista vazia.',
    why: 'É o formato que a pessoa já conhece de qualquer site de preço, e com 3 planos cabe inteiro na tela do notebook. No celular os cards empilham sem perder nada.'},
  b: {title: 'B · Tabela para comparar', tag: 'Para quando houver muitos recursos',
    what: 'Uma tabela com os planos nas colunas e os recursos nas linhas, agrupados pela categoria do Hub. O plano recomendado ganha a coluna em verde claro. No celular vira uma escolha de plano em abas, com a lista daquele plano.',
    why: 'Ganha quando a lista de recursos crescer (8 ou mais). Com 4 a 6 recursos, fica mais pesada que os cards.'},
};

let opt = 'a', state = 'three', dev = 'desktop', yearly = false, mPick = 1;
const $ = s => document.querySelector(s);
const brl = n => n.toLocaleString('pt-BR', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});

function priceBlock(p) {
  if (!yearly) return `<div class="price"><small>R$</small><b>${brl(p.m)}</b><span>/mês</span></div>
    <div class="under">ou R$ ${brl(p.y)} por ano, <strong>2 meses grátis</strong></div>`;
  const perMonth = Math.round(p.y / 12 * 100) / 100;
  return `<div class="price"><small>R$</small><b>${brl(perMonth)}</b><span>/mês</span></div>
    <div class="under">R$ ${brl(p.y)} por ano, <strong>2 meses grátis</strong></div>`;
}
const cta = p => `<a class="tc-btn ${p.rec ? 'pri' : 'out'}">${WA}Quero o ${p.name}</a>`;

function card(p) {
  return `<div class="plan${p.rec ? ' rec' : ''}">
    ${p.rec ? '<span class="selo">Recomendado</span>' : ''}
    <h3>${p.name}</h3><p class="desc">${p.desc}</p>
    ${priceBlock(p)}
    ${cta(p)}
    <ul class="feats">${FEATURES.map((f, k) => p.on.includes(k)
      ? `<li class="on"><i>${CHECK}</i>${f.name}</li>`
      : `<li class="off"><i></i>${f.name}</li>`).join('')}</ul>
  </div>`;
}

function table(plans) {
  const n = plans.length;
  const used = FEATURES.map((f, k) => ({...f, k})).filter(f => plans.some(p => p.on.includes(f.k)));
  const cats = [...new Set(used.map(f => f.cat))];
  const recCls = p => p.rec ? ' rec' : '';
  return `<div class="table" style="--n:${n}">
    <div class="trow head"><div></div>${plans.map(p => `<div class="th${recCls(p)}">${p.rec ? '<span class="selo">Recomendado</span>' : ''}<h3>${p.name}</h3><p class="desc">${p.desc}</p>${priceBlock(p)}${cta(p)}</div>`).join('')}</div>
    ${cats.map(c => `<div class="trow tgroup"><div>${c}</div>${plans.map(p => `<div class="${recCls(p).trim()}"></div>`).join('')}</div>
      ${used.filter(f => f.cat === c).map(f => `<div class="trow"><div class="tlabel">${f.name}<small>${f.hint}</small></div>${plans.map(p => `<div class="cell ${p.on.includes(f.k) ? 'on' : 'off'}${recCls(p)}"><i>${p.on.includes(f.k) ? CHECK : ''}</i></div>`).join('')}</div>`).join('')}`).join('')}
  </div>`;
}

function section(mobile) {
  const head = `<div class="pitch"><span class="kicker">Planos</span><h2>Escolha o tamanho do seu TechCare</h2><p>Comece pelo que você precisa hoje e mude de plano quando a assistência crescer.</p></div>`;
  const assure = `<div class="assure"><span>Sem fidelidade</span><span>Cancela quando quiser</span><span>Suporte com gente de verdade</span></div>`;
  if (state === 'down') {
    return head + `<div class="fallback"><h3>Fale com a gente e veja o plano certo</h3><p>A gente mostra o TechCare funcionando e indica o plano pelo tamanho da sua assistência.</p><a class="tc-btn pri">${WA}Falar no WhatsApp</a></div>` + assure;
  }
  const plans = PLANS[state];
  const billing = `<div class="billing"><div class="seg2"><button data-b="m" aria-pressed="${!yearly}">Mensal</button><button data-b="y" aria-pressed="${yearly}">Anual <em>2 meses grátis</em></button></div></div>`;
  if (opt === 'a') return head + billing + `<div class="grid n${plans.length}">${plans.map(card).join('')}</div>` + assure;
  const pick = Math.min(mPick, plans.length - 1);
  const mobilePick = `<div class="mpick"><div class="tabs">${plans.map((p, k) => `<button data-pick="${k}" aria-pressed="${k === pick}">${p.name}</button>`).join('')}</div>${card(plans[pick])}</div>`;
  return head + billing + table(plans) + (mobile ? mobilePick : '') + assure;
}

function page(mobile) {
  return `<nav class="tc-nav"><div class="tc-logo"><i></i>Facter <span>/ TechCare</span></div>
    <div class="tc-links"><span>A jornada</span><span>Garantia</span><span>Para quem</span><span>Planos</span></div>
    <a class="tc-btn pri">Ver funcionando</a></nav>
    <section class="sec">${section(mobile)}</section>`;
}

function notes() {
  const o = OPTIONS[opt];
  $('#notes').innerHTML = `<h3>${o.title}</h3><span class="tag${o.rec ? ' rec' : ''}">${o.tag}</span>
    <dl><dt>Como é</dt><dd>${o.what}</dd><dt>Por que</dt><dd>${o.why}</dd></dl>
    <hr><h3>Muda nas duas</h3>
    <ul>
      <li>Sem sombra e sem degradê no botão: separação por borda, como o resto do padrão.</li>
      <li>Mensal e anual numa escolha só, em vez de duas linhas de preço em cada card.</li>
      <li>O botão diz o que acontece: abre o WhatsApp com o plano escolhido ("Quero o Estoque Pro").</li>
      <li>O selo "Recomendado" só aparece no plano marcado como popular no Hub. Sem marcação, nenhum card ganha selo.</li>
      <li>Título sem ponto final e uma linha embaixo dizendo que dá para trocar de plano.</li>
      <li>Se entrar um quarto plano, os cards ficam em 4 colunas. O Hub sem responder mostra o convite para o WhatsApp.</li>
    </ul>
    <hr><h3>No Hub, antes de subir</h3>
    <ul>
      <li>Hoje a ordem dos planos é 0 nos três. Vale numerar 1, 2, 3 para a página não depender do preço.</li>
      <li>A descrição de cada plano aparece embaixo do nome. Os textos daqui são sugestão.</li>
      <li>Os recursos marcados em cada plano decidem os checks. No Hub hoje o Estoque tem Ordens de serviço e Orçamento, e o Estoque Pro não tem nada a mais que ele.</li>
      <li>Recurso que nenhum plano tem não aparece na página.</li>
    </ul>`;
}

function render() {
  $('#screen').innerHTML = page(false);
  $('#phone').innerHTML = page(true);
  notes();
  fit();
}

function fit() {
  const vp = $('#vp'), s = Math.min(1, vp.clientWidth / 1280), sc = $('#screen');
  sc.style.transform = `scale(${s})`;
  vp.style.height = sc.offsetHeight * s + 'px';
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-b]');
  if (b) { yearly = b.dataset.b === 'y'; render(); return; }
  const p = e.target.closest('[data-pick]');
  if (p) { mPick = Number(p.dataset.pick); render(); }
});

function bindSeg(id, get, set) {
  const btns = document.querySelectorAll(`#${id} button`);
  const sync = () => btns.forEach(x => x.setAttribute('aria-pressed', x.dataset.v === get()));
  btns.forEach(x => x.onclick = () => { set(x.dataset.v); sync(); location.hash = `${opt}-${state}`; render(); });
  sync();
}
const [h1, h2] = location.hash.slice(1).split('-');
if (OPTIONS[h1]) opt = h1;
if (h2 === 'three' || h2 === 'down') state = h2;
bindSeg('opts', () => opt, v => opt = v);
bindSeg('states', () => state, v => state = v);
bindSeg('devs', () => dev, v => { dev = v; $('#desk').hidden = v !== 'desktop'; $('#mob').hidden = v !== 'phone'; });
addEventListener('resize', fit);
render();
</script>
</body>
</html>
