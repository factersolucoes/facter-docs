<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pátio da oficina · console · mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--mf:240 4% 44%;--border:240 6% 90%}
*{box-sizing:border-box}
body{margin:0;background:hsl(228 16% 90%);color:hsl(240 10% 6%);font:14.5px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
.ic{display:inline-block;width:18px;height:18px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;flex:none;vertical-align:-3px}
.s12{width:12px;height:12px}.s13{width:13px;height:13px}.s14{width:14px;height:14px}.s16{width:16px;height:16px}.s20{width:20px;height:20px}.s22{width:22px;height:22px}
.i-door2{--i:url(https://api.iconify.design/ph/garage.svg)}.i-wrench{--i:url(https://api.iconify.design/ph/wrench.svg)}.i-in{--i:url(https://api.iconify.design/ph/sign-in.svg)}.i-out{--i:url(https://api.iconify.design/ph/sign-out.svg)}.i-pause{--i:url(https://api.iconify.design/ph/pause-fill.svg)}.i-plus{--i:url(https://api.iconify.design/ph/plus.svg)}.i-phone{--i:url(https://api.iconify.design/ph/phone-call-fill.svg)}.i-caret{--i:url(https://api.iconify.design/ph/caret-down.svg)}.i-tow{--i:url(https://api.iconify.design/ph/truck-trailer.svg)}.i-flag{--i:url(https://api.iconify.design/ph/flag-checkered.svg)}.i-check{--i:url(https://api.iconify.design/ph/check.svg)}
.doc{max-width:1200px;margin:0 auto;padding:36px 20px 90px}
.doc h1{font:800 27px/1.15 Sora;letter-spacing:-.02em}
.doc .lead{color:hsl(var(--mf));max-width:880px;margin-top:9px;font-size:14px}
.stageouter{margin-top:20px;background:radial-gradient(hsl(220 8% 85%) 1px,transparent 1.4px) 0 0/22px 22px,hsl(220 10% 91.5%);border:1px solid hsl(var(--border));border-radius:18px;padding:22px}
.flow{background:hsl(0 0% 100%);border-radius:20px;box-shadow:0 40px 90px -36px hsl(232 48% 15%/.5)}

.chead{display:flex;align-items:center;gap:13px;padding:15px 22px;border-bottom:1px solid hsl(var(--border))}
.chead .eicon{width:42px;height:42px;border-radius:12px;background:hsl(233 85% 96.5%);color:hsl(233 70% 44%);display:grid;place-items:center;flex:none}
.chead .eyebrow{font:700 10px Sora;text-transform:uppercase;letter-spacing:.08em;color:hsl(233 70% 44%)}
.chead .enm{font:800 20px Sora;letter-spacing:-.015em;margin-top:1px}
.basepick{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid hsl(240 6% 83%);background:#fff;font:600 12.5px Inter;cursor:pointer}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:hsl(var(--mf))}
.live .p{width:8px;height:8px;border-radius:50%;background:hsl(150 55% 45%);animation:pz 1.8s infinite}
@keyframes pz{0%{box-shadow:0 0 0 0 hsl(150 55% 45%/.5)}70%{box-shadow:0 0 0 7px hsl(150 55% 45%/0)}100%{box-shadow:0 0 0 0 hsl(150 55% 45%/0)}}
.hsearch{flex:1;max-width:300px}
.hsearch input{width:100%;height:37px;border-radius:10px;border:1px solid hsl(240 6% 86%);padding:0 13px;font:inherit;font-size:13px;background:hsl(240 8% 98%);outline:none}
.hsearch input:focus{border-color:hsl(233 60% 66%);box-shadow:0 0 0 3px hsl(233 82% 94%)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:hsl(var(--border));border-bottom:1px solid hsl(var(--border))}
.kpi{background:#fff;padding:13px 18px;display:flex;align-items:center;gap:12px}
.kpi .kico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:hsl(233 85% 96.5%);color:hsl(233 62% 50%)}
.kpi.warn .kico{background:hsl(40 80% 93%);color:hsl(28 72% 42%)}
.kpi.ok .kico{background:hsl(150 45% 93%);color:hsl(152 52% 34%)}
.kpi .kt{display:flex;flex-direction:column}
.kpi .kv{font:800 23px/1.1 Sora;font-variant-numeric:tabular-nums}
.kpi .kl{font:600 11px Inter;color:hsl(var(--mf))}
.kpi.warn .kv{color:hsl(28 72% 38%)}.kpi.ok .kv{color:hsl(152 55% 30%)}

.body{padding:18px 22px 22px}
.sec+.sec{margin-top:22px}
.seclbl{font:700 11px Sora;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:7px;margin-bottom:11px;color:hsl(var(--mf))}
.seclbl.in{color:hsl(28 70% 38%)}.seclbl.out{color:hsl(152 55% 30%)}
.seclbl .cnt{background:hsl(240 6% 95%);border-radius:99px;padding:1px 8px;font:800 10.5px Sora;color:hsl(235 10% 34%)}

/* arrivals / ready — compact cards */
.lane{display:flex;gap:13px;overflow-x:auto;padding:2px 2px 6px}
.acard{flex:none;width:312px;display:flex;align-items:center;gap:13px;border:1px solid hsl(var(--border));border-radius:16px;background:#fff;padding:11px;box-shadow:0 12px 28px -24px hsl(232 40% 30%/.45);transition:transform .12s,box-shadow .12s}
.acard:hover{transform:translateY(-2px);box-shadow:0 20px 40px -24px hsl(232 40% 30%/.55);border-color:hsl(233 40% 86%)}
.acard .mbay{position:relative;width:124px;height:78px;flex:none;border-radius:12px;background:hsl(240 11% 98%);border:1px solid hsl(240 6% 92%);overflow:hidden}
.acard .mbay svg{display:block;width:100%;height:100%}
.mchip{position:absolute;top:6px;left:6px;display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 8px;border-radius:99px;font:700 9.5px Inter}
.mchip .d{width:5px;height:5px;border-radius:50%}
.mchip.c-in{background:hsl(150 50% 93%);color:hsl(152 55% 28%)}.mchip.c-in .d{background:hsl(150 52% 44%)}
.mchip.c-tow{background:hsl(0 82% 96%);color:hsl(0 60% 42%)}.mchip.c-tow .d{background:hsl(0 70% 56%)}
.mchip.c-free{background:hsl(150 50% 93%);color:hsl(152 55% 28%)}.mchip.c-free .d{background:hsl(150 52% 44%)}
.acard .ai{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.acard .ai .btn{align-self:flex-start;margin-top:2px}
.acard .an{font:800 14px Sora;display:flex;align-items:center;gap:7px}
.acard .plate{display:inline-flex;flex-direction:column;border:1.2px solid hsl(235 16% 40%);border-radius:3px;overflow:hidden;background:#fff}
.acard .plate .pt{height:4px;background:hsl(221 72% 42%)}.acard .plate .pn{font:800 9px/12px ui-monospace,Menlo,monospace;padding:0 4px;color:hsl(235 22% 16%)}
.acard .am{font-size:11px;color:hsl(var(--mf));margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srcb{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1.5px 7px;font:700 10px Inter}
.srcb.ok{background:hsl(150 50% 94%);color:hsl(152 55% 28%)}.srcb.tow{background:hsl(0 80% 96%);color:hsl(0 60% 42%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:33px;padding:0 12px;border-radius:9px;border:1px solid transparent;font:700 12px Inter;cursor:pointer;white-space:nowrap}
.btn-pri{background:hsl(233 66% 52%);color:#fff}.btn-go{background:hsl(150 55% 42%);color:#fff}.btn-out{background:#fff;border-color:hsl(240 6% 83%);color:hsl(235 10% 28%)}
.acard .wait{font:700 11.5px Sora;color:hsl(235 10% 30%)}.acard .wait.long{color:hsl(0 60% 46%)}

/* long bays */
.bays{display:flex;flex-direction:column;gap:14px}
.baywrap{position:relative;display:inline-block;max-width:100%}
.baywrap svg{display:block;height:128px;width:auto;max-width:100%}
.schip{position:absolute;left:14px;top:12px;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px;border-radius:99px;font:700 11.5px Inter;box-shadow:0 2px 6px -2px hsl(232 30% 40%/.25)}
.schip .d{width:7px;height:7px;border-radius:50%}
.st-run{background:hsl(233 60% 97%);color:hsl(233 60% 42%)}.st-run .d{background:hsl(233 60% 56%)}
.st-pause{background:hsl(40 72% 94%);color:hsl(28 70% 34%)}.st-pause .d{background:hsl(36 72% 52%)}
.st-free{background:hsl(150 45% 95%);color:hsl(152 50% 30%)}.st-free .d{background:hsl(150 50% 46%)}
.icard{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:168px;display:flex;flex-direction:column;gap:5px}
.icard .nm{font:800 16px Sora;color:hsl(235 14% 18%);display:flex;align-items:center;gap:7px;line-height:1.1}
.plate{display:inline-flex;flex-direction:column;border:1.3px solid hsl(235 16% 38%);border-radius:4px;overflow:hidden;background:#fff;flex:none}
.plate .pt{height:5px;background:linear-gradient(180deg,hsl(221 72% 44%),hsl(221 74% 38%))}
.plate .pn{font:800 10.5px/14px ui-monospace,Menlo,monospace;letter-spacing:.07em;padding:0 5px;color:hsl(235 22% 15%)}
.icard .timeline{display:flex;align-items:baseline;gap:7px;margin-top:1px}
.icard .time{font:800 22px Sora;color:hsl(235 14% 18%);font-variant-numeric:tabular-nums}
.icard .svc{font-size:10.5px;color:hsl(var(--mf))}
.icard .osb{align-self:flex-start;margin-top:4px;display:inline-flex;align-items:center;gap:5px;background:hsl(233 50% 97%);border:1px solid hsl(233 48% 92%);border-radius:7px;padding:2.5px 9px;font:700 10.5px Sora;color:hsl(233 52% 50%)}
.icard .osb::before{content:"";width:5px;height:5px;border-radius:50%;background:hsl(233 60% 60%)}
.freecard{position:absolute;right:30px;top:50%;transform:translateY(-50%);text-align:right}
.freecard .ft{font:800 15px Sora;color:hsl(152 48% 34%)}.freecard .fs{font-size:11.5px;color:hsl(var(--mf))}

/* popover */
.pop{position:absolute;right:10px;top:10px;width:318px;background:#fff;border:1px solid hsl(var(--border));border-radius:14px;box-shadow:0 30px 70px -22px hsl(232 48% 20%/.5);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s;z-index:40;overflow:hidden}
.baywrap:hover .pop{opacity:1;visibility:visible;transform:none}
.pop .ph{padding:13px 15px;background:linear-gradient(120deg,hsl(233 70% 97%),#fff);border-bottom:1px solid hsl(var(--border))}
.pop .ph .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pop .ph .pos{font:700 12px Sora;color:hsl(233 55% 48%)}
.pop .ph .nm{font:800 17px Sora;margin-top:3px;display:flex;align-items:center;gap:8px}
.pop .ph .sub{font-size:11.5px;color:hsl(var(--mf));margin-top:2px}
.pop .pb{padding:12px 15px;max-height:260px;overflow:auto}
.pop .plbl{font:700 10px Sora;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--mf));margin:2px 0 7px}
.pop .pbk+.pbk{margin-top:13px}
.pop .pc{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid hsl(240 6% 94%)}.pop .pc:first-of-type{border-top:0}
.pop .pc .dd{width:8px;height:8px;border-radius:50%;flex:none}.pop .pc .pcn{font:700 12.5px Sora;flex:1;min-width:0}.pop .pc .pcs{font-size:11px;color:hsl(var(--mf))}
.pop .svc{display:flex;align-items:center;gap:9px;padding:5px 0}
.pop .svc .bar{flex:1;height:6px;border-radius:3px;background:hsl(240 6% 92%);overflow:hidden}.pop .svc .bar i{display:block;height:100%;border-radius:3px;background:hsl(233 60% 58%)}
.pop .svc .pct{font:700 11px Sora;color:hsl(235 10% 34%);width:30px;text-align:right}
.pop .team{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pop .tm{display:inline-flex;align-items:center;gap:6px;background:hsl(240 6% 96%);border-radius:99px;padding:3px 10px 3px 3px;font:600 11.5px Inter}
.av{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font:800 8.5px Inter;color:#fff}
.pop .pf{padding:11px 15px;border-top:1px solid hsl(var(--border));display:flex;gap:8px}
.pop .pf .btn{flex:1}
.sbar{display:flex;align-items:center;gap:14px;padding:10px 22px;border-top:1px solid hsl(var(--border));font-size:11px;color:hsl(var(--mf))}
.sbar .leg{display:inline-flex;align-items:center;gap:5px}.sbar .leg i{width:9px;height:9px;border-radius:50%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="floorg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(240 12% 99%)"/><stop offset="1" stop-color="hsl(240 9% 96.5%)"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(240 10% 88%)"/><stop offset="0.16" stop-color="hsl(0 0% 100%)"/><stop offset="0.84" stop-color="hsl(0 0% 100%)"/><stop offset="1" stop-color="hsl(240 10% 87%)"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(212 28% 46%)"/><stop offset="1" stop-color="hsl(214 32% 32%)"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(235 9% 91%)"/><stop offset="0.5" stop-color="hsl(235 7% 80%)"/><stop offset="1" stop-color="hsl(235 8% 71%)"/></linearGradient>
  <filter id="sh" x="-5%" y="-30%" width="110%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="hsl(232 30% 28%)" flood-opacity="0.14"/></filter>
</defs></svg>

<div class="doc">
  <h1>Pátio da oficina — console vivo</h1>
  <p class="lead">A tela da Recepção: o que chegou e espera OS, os veículos nos boxes (baia longa, no comprimento real) e o que está pronto pra retirada. Estado sobre o box, identificação e tempo à direita; <b>passe o mouse numa baia</b> pro detalhe.</p>
  <div class="stageouter"><div class="flow" id="flow"></div></div>
</div>

<script>
const CY=78;
const SC={run:{d:'hsl(233 60% 56%)',cls:'st-run',label:'Em manutenção'},pause:{d:'hsl(36 72% 52%)',cls:'st-pause',label:'Pausada'}};
const AVC=['hsl(233 55% 58%)','hsl(170 45% 42%)','hsl(28 65% 56%)','hsl(280 40% 58%)'];

/* vehicle drawing */
function tire(x,y){return '<rect x="'+x+'" y="'+y+'" width="24" height="10" rx="3" fill="hsl(235 13% 23%)"/>';}
function axleV(x,kind){const beam='<rect x="'+(x-3)+'" y="'+(CY-40)+'" width="6" height="80" rx="3" fill="hsl(235 10% 56%)"/>';const diff=kind==='drive'?'<ellipse cx="'+x+'" cy="'+CY+'" rx="9" ry="13" fill="hsl(235 12% 42%)"/><circle cx="'+x+'" cy="'+CY+'" r="4" fill="hsl(235 12% 30%)"/>':'';const t=kind==='steer'?tire(x-12,CY-45)+tire(x-12,CY+35):tire(x-12,CY-50)+tire(x-12,CY-38)+tire(x-12,CY+28)+tire(x-12,CY+40);return '<g>'+beam+diff+t+'</g>';}
function hCavalo(x){const g=axleV(x+30,'steer')+axleV(x+102,'drive')+axleV(x+130,'drive')+'<rect x="'+(x+66)+'" y="'+(CY-20)+'" width="78" height="40" rx="8" fill="url(#body)" stroke="hsl(240 7% 85%)" stroke-width="1.3"/><rect x="'+(x+122)+'" y="'+(CY-11)+'" width="22" height="22" rx="5" fill="hsl(240 6% 84%)"/><circle cx="'+(x+133)+'" cy="'+CY+'" r="5" fill="hsl(240 6% 70%)"/><rect x="'+x+'" y="'+(CY-34)+'" width="70" height="68" rx="16" fill="url(#body)" stroke="hsl(240 7% 84%)" stroke-width="1.3"/><path d="M'+(x+14)+' '+(CY-26)+' q-12 26 0 52 l8 0 q-10 -26 0 -52 Z" fill="url(#glass)"/><rect x="'+(x-2)+'" y="'+(CY-30)+'" width="8" height="12" rx="2" fill="url(#body)" stroke="hsl(240 6% 82%)"/><rect x="'+(x-2)+'" y="'+(CY+18)+'" width="8" height="12" rx="2" fill="url(#body)" stroke="hsl(240 6% 82%)"/>';return ['<g filter="url(#sh)">'+g+'</g>',146];}
function barroteH(x){return '<rect x="'+(x-4)+'" y="'+(CY-25)+'" width="8" height="50" rx="2" fill="url(#steel)" stroke="hsl(235 9% 64%)" stroke-width="0.7"/><line x1="'+x+'" y1="'+(CY-22)+'" x2="'+x+'" y2="'+(CY+22)+'" stroke="hsl(235 7% 72%)" stroke-width="0.7" opacity=".55"/><rect x="'+(x-6)+'" y="'+(CY-29)+'" width="12" height="5" rx="1.5" fill="hsl(235 9% 72%)"/><rect x="'+(x-6)+'" y="'+(CY+24)+'" width="12" height="5" rx="1.5" fill="hsl(235 9% 72%)"/><circle cx="'+(x-3)+'" cy="'+(CY-26.5)+'" r="1" fill="hsl(235 12% 48%)"/><circle cx="'+(x+3)+'" cy="'+(CY-26.5)+'" r="1" fill="hsl(235 12% 48%)"/><circle cx="'+(x-3)+'" cy="'+(CY+26.5)+'" r="1" fill="hsl(235 12% 48%)"/><circle cx="'+(x+3)+'" cy="'+(CY+26.5)+'" r="1" fill="hsl(235 12% 48%)"/>';}
function fueiroH(x){const p=(y0)=>'<rect x="'+(x-2.2)+'" y="'+y0+'" width="4.4" height="18" rx="1.4" fill="url(#steel)" stroke="hsl(235 9% 58%)" stroke-width="0.6"/>';return p(CY-49)+p(CY+31)+'<rect x="'+(x-2.8)+'" y="'+(CY-50.5)+'" width="5.6" height="2.6" rx="1" fill="hsl(235 11% 54%)"/><rect x="'+(x-2.8)+'" y="'+(CY+47.9)+'" width="5.6" height="2.6" rx="1" fill="hsl(235 11% 54%)"/>';}
function hCarreta(x){let s='<rect x="'+x+'" y="'+(CY-3)+'" width="20" height="6" rx="2" fill="hsl(235 8% 70%)"/><rect x="'+(x+16)+'" y="'+(CY-30.5)+'" width="152" height="6.5" rx="2.5" fill="url(#steel)" stroke="hsl(235 8% 66%)" stroke-width="0.7"/><rect x="'+(x+16)+'" y="'+(CY+24)+'" width="152" height="6.5" rx="2.5" fill="url(#steel)" stroke="hsl(235 8% 66%)" stroke-width="0.7"/>';for(const bx of [x+40,x+90,x+140])s+=barroteH(bx)+fueiroH(bx);s+=axleV(x+118,'trailer')+axleV(x+146,'trailer');return ['<g filter="url(#sh)">'+s+'</g>',172];}
function hDolly(x){return ['<g filter="url(#sh)"><rect x="'+x+'" y="'+(CY-4)+'" width="20" height="8" rx="3" fill="hsl(235 8% 72%)"/>'+axleV(x+26,'trailer')+'<rect x="'+(x+18)+'" y="'+(CY-14)+'" width="18" height="28" rx="5" fill="hsl(240 8% 88%)" stroke="hsl(240 7% 80%)"/></g>',40];}
function hLanding(x){return ['<g filter="url(#sh)"><rect x="'+(x+5)+'" y="'+(CY-26)+'" width="5" height="12" rx="1.5" fill="hsl(235 8% 66%)"/><rect x="'+(x+5)+'" y="'+(CY+14)+'" width="5" height="12" rx="1.5" fill="hsl(235 8% 66%)"/><rect x="'+x+'" y="'+(CY-3)+'" width="18" height="6" rx="2" fill="hsl(235 8% 72%)"/></g>',18];}
function compose(r){let x=r.start,out='';for(const k of r.seq){let v;if(k==='dolly')v=hDolly(x);else if(k==='cavalo')v=hCavalo(x);else if(k==='landing')v=hLanding(x);else v=hCarreta(x);out+=v[0];x+=(k==='carreta')?v[1]-6:v[1];}return out;}
function baySvg(num,occ,w){return '<svg viewBox="0 0 '+w+' 156"><rect x="6" y="8" width="'+(w-12)+'" height="140" rx="16" fill="url(#floorg)" stroke="hsl(240 6% 88%)" stroke-width="1.5"/><rect x="16" y="18" width="'+(w-32)+'" height="120" rx="10" fill="none" stroke="hsl(43 42% 76%)" stroke-width="2" stroke-dasharray="2 9" opacity=".6"/><text x="54" y="104" text-anchor="middle" font-family="Sora,sans-serif" font-weight="800" font-size="60" fill="hsl(235 10% 54% / .09)">'+num+'</text><g stroke="hsl(240 6% 86%)" stroke-width="3" stroke-linecap="round"><line x1="8" y1="40" x2="8" y2="60"/><line x1="8" y1="96" x2="8" y2="116"/></g>'+occ+'</svg>';}

/* mini-bay thumbnail for arrivals/ready — echoes the big bays */
function miniBay(kind){
  if(kind==='carreta') return '<svg viewBox="26 14 184 128"><rect x="30" y="18" width="176" height="120" rx="11" fill="url(#floorg)"/>'+hCarreta(40)[0]+'</svg>';
  return '<svg viewBox="24 14 178 128"><rect x="28" y="18" width="170" height="120" rx="11" fill="url(#floorg)"/>'+compose({start:40,seq:['cavalo']})+'</svg>';
}

function plateHtml(pn){return '<span class="plate"><span class="pt"></span><span class="pn">'+pn+'</span></span>';}
function popover(d){const sc=SC[d.st];const pieces=d.pieces.map(p=>'<div class="pc"><span class="dd" style="background:'+SC[p.st].d+'"></span><span class="pcn">'+p.nm+'</span><span class="pcs">'+p.sub+'</span></div>').join('');const svcs=d.services.map(v=>'<div class="svc"><span style="flex:1;font-size:11.5px">'+v.n+'</span><span class="bar"><i style="width:'+Math.round(v.p*100)+'%"></i></span><span class="pct">'+Math.round(v.p*100)+'%</span></div>').join('');const team=d.team.map((m,i)=>'<span class="tm"><span class="av" style="background:'+AVC[i%AVC.length]+'">'+m.i+'</span>'+m.n+'</span>').join('');return '<div class="pop"><div class="ph"><div class="r1"><span class="pos">'+d.os+'</span><span class="schip '+sc.cls+'" style="position:static;box-shadow:none"><span class="d"></span>'+sc.label+'</span></div><div class="nm">'+d.id.name+(d.id.plate?plateHtml(d.id.plate):'')+'</div><div class="sub">'+(d.id.kind?d.id.kind+' · ':'')+'aberta há '+d.time+' · '+d.base+'</div></div><div class="pb"><div class="pbk"><div class="plbl">'+(d.pieces.length>1?'Peças do conjunto':'Veículo')+'</div>'+pieces+'</div><div class="pbk"><div class="plbl">Serviços em andamento</div>'+svcs+'</div><div class="pbk"><div class="plbl">Equipe no box</div><div class="team">'+team+'</div></div></div><div class="pf"><button class="btn btn-pri">Ver OS</button><button class="btn btn-out">Linha do tempo</button></div></div>';}
function overlay(d){const sc=SC[d.st];return '<div class="schip '+sc.cls+'"><span class="d"></span>'+sc.label+'</div><div class="icard"><div class="nm">'+d.id.name+(d.id.plate?plateHtml(d.id.plate):'')+'</div><div class="timeline"><span class="time">'+d.time+'</span><span class="svc">'+d.service+'</span></div><div class="osb">'+d.os+'</div></div>'+popover(d);}

function acard(a){
  const chip=a.ready?'<span class="mchip c-free"><span class="d"></span>Pronto</span>':'<span class="mchip '+(a.src==='tow'?'c-tow':'c-in')+'"><span class="d"></span>'+(a.src==='tow'?'Guincho':'Check-in')+'</span>';
  const meta=a.ready?('<span class="wait'+(a.long?' long':'')+'">pronto há '+a.wait+'</span> · '+a.os):('chegou há '+a.wait);
  const act=a.ready?'<button class="btn btn-go"><i class="ic s14 i-out"></i>Dar saída</button>':'<button class="btn btn-pri"><i class="ic s14 i-plus"></i>Abrir OS</button>';
  return '<div class="acard"><div class="mbay">'+miniBay(a.kind)+chip+'</div><div class="ai"><div class="an">'+a.nm+plateHtml(a.pn)+'</div><div class="am">'+meta+'</div>'+act+'</div></div>';
}
